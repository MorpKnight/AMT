name: Swift Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: XCTest
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run XCTest
        run: |
          xcodebuild \
            -project AMT.xcodeproj \
            -scheme AMT \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/amt-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/amt-source-packages" \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
